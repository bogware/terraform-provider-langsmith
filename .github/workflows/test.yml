# Terraform Provider testing workflow.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'

permissions:
  contents: read
  id-token: write

# Codecov: use OIDC (`use_oidc`) so uploads work without a `CODECOV_TOKEN` secret once
# the repo is activated in Codecov. Pass an explicit `slug` because `go.mod` still
# uses the module path `github.com/bogware/terraform-provider-langsmith` while CI runs
# in `tsjnsn/terraform-provider-langsmith`, which can otherwise yield "Repository not found".
# Skip uploads for fork PRs (no OIDC; upstream secrets are unavailable).
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned v1.x: repo `.golangci.yml` uses golangci-lint v1 format (see AGENTS.md).
          version: v1.64.8
          # Prebuilt golangci-lint binaries can lag the `go` version in go.mod (e.g. after
          # toolchain bumps). Compile the linter with the same Go release as `setup-go`.
          install-mode: goinstall

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      # govulncheck v1.2+ requires Go 1.25+; use a newer toolchain only for this scan so
      # `go.mod` can keep a lower minimum Go version for provider consumers.
      - name: Run govulncheck
        env:
          GOTOOLCHAIN: go1.25.10
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.2.0 ./...

  generate:
    name: Verify Generated Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: make generate
      - name: Verify no diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference after code generation. Run 'make generate' and commit."; exit 1)

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      # terraform-plugin-testing shells out to Terraform; without a binary on PATH
      # it falls back to hc-install + release checksum verification (can fail when
      # Hashicorp's signing key material is stale in transitive deps).
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go mod download
      - name: Run unit tests with coverage profile
        run: |
          go test ./... \
            -coverpkg=./... \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout=120s \
            -parallel=10
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          slug: tsjnsn/terraform-provider-langsmith
          files: coverage.out
          flags: unit
          fail_ci_if_error: true
          name: unit

  # Catches data races in provider and client code. Keep ./... unless a package
  # must be temporarily excluded — if so, track removal of the skip in a follow-up issue.
  unit-tests-race:
    name: Unit Tests (race)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: go test -race -timeout=300s ./...

  acceptance-tests:
    name: Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go mod download
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # Tenant/workspace ID: repository variable (plain) or secret — either works.
          LANGSMITH_TENANT_ID: ${{ vars.LANGSMITH_TENANT_ID || secrets.LANGSMITH_TENANT_ID }}
        run: go test -v -cover -timeout 30m ./internal/provider/
